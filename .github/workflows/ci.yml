name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-test-build:
    name: check / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # CI 与测试绝不依赖真实 API Key（仓库安全不变量）
      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc + svelte-check)
        run: npm run check

      - name: Test (vitest, no real network)
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
